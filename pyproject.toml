[tool.poetry]
name = "payment-service"
version = "0.1.0"
description = "Asynchronous payment processing service"
authors = ["Payment Service <payment-service@localhost>"]
readme = "README.md"
packages = [{ include = "payments", from = "src" }]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.163"
uvicorn = { extras = ["standard"], version = "^0.54" }
sqlalchemy = { extras = ["asyncio"], version = "^2.1" }
asyncpg = "^0.32"
alembic = "^1.20"
pydantic-settings = "^2.16"
faststream = { extras = ["rabbit", "cli"], version = "^0.7.8" }
httpx = "^0.28"
coverage = { extras = ["toml"], version = "^7.17" }

[tool.poetry.group.dev.dependencies]
pytest = "^9.2"
pytest-asyncio = "^1.5"
ruff = "^0.17"
mypy = "^2.4"

[tool.poetry.group.e2e.dependencies]
pytest = "^9.2"
httpx = "^0.28"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
cache_dir = "/tmp/pytest-cache"
markers = [
    "e2e: HTTP checks against a running stack (E2E_BASE_URL)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
cache-dir = "/tmp/ruff-cache"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["payments", "tests"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*.py" = ["E501"]
"alembic/env.py" = ["E402", "I001"]

[tool.ruff.format]
quote-style = "single"
line-ending = "lf"

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["payments"]
cache_dir = "/tmp/mypy-cache"
ignore_missing_imports = true
check_untyped_defs = false
disallow_untyped_defs = false
disallow_incomplete_defs = false
warn_return_any = false
warn_unused_ignores = true
no_implicit_optional = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.coverage.run]
branch = true
parallel = true
# SQLAlchemy asyncio переключает контекст через greenlet — без этого строки после await теряются.
concurrency = ["thread", "greenlet"]
source = ["payments"]
omit = ["*/tests/*", "*/alembic/*"]

[tool.coverage.report]
show_missing = true
skip_empty = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
]

[tool.coverage.html]
directory = "htmlcov"
